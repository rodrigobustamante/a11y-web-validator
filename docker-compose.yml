# Docker Compose for local development
# For production: Use Railway (API) + Vercel (Frontend)

version: '3.8'

services:
  # Backend API with Playwright
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: a11y-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - CORS_ORIGIN=http://localhost:3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # Playwright needs more memory
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

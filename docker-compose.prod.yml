version: '3.8'

services:
  # Backend API with Playwright
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: a11y-api
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - a11y-network
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    labels:
      # Traefik labels for Dokploy
      - "traefik.enable=true"
      - "traefik.http.routers.a11y-api.rule=Host(`api.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.a11y-api.entrypoints=websecure"
      - "traefik.http.routers.a11y-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.a11y-api.loadbalancer.server.port=3001"

  # Frontend Next.js
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://api.${DOMAIN:-localhost}
    container_name: a11y-web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - a11y-network
      - dokploy-network
    labels:
      # Traefik labels for Dokploy
      - "traefik.enable=true"
      - "traefik.http.routers.a11y-web.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.a11y-web.entrypoints=websecure"
      - "traefik.http.routers.a11y-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.a11y-web.loadbalancer.server.port=3000"

networks:
  a11y-network:
    driver: bridge
  dokploy-network:
    external: true


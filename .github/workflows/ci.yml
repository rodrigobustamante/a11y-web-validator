name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (API)
        run: pnpm --filter @a11y-web-validator/api exec tsc --noEmit

      - name: Type check (Web)
        run: pnpm --filter @a11y-web-validator/web exec tsc --noEmit

      - name: Build API
        run: pnpm --filter @a11y-web-validator/api build

      - name: Install Chromium (API tests)
        run: pnpm --filter @a11y-web-validator/api exec playwright install --with-deps chromium-headless-shell

      - name: Test (API)
        run: pnpm --filter @a11y-web-validator/api test

      - name: Test (Web)
        run: pnpm --filter @a11y-web-validator/web test

      - name: Build Web
        run: pnpm --filter @a11y-web-validator/web build

      - name: Lint
        run: pnpm run lint
        continue-on-error: true

  docker:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: a11y-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
